<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacantes · ChambasAI</title>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f7f7f5; --hover:rgba(55,53,47,.04); --hover-strong:rgba(55,53,47,.08);
  --text:#37352f; --text-2:rgba(55,53,47,.65); --text-3:rgba(55,53,47,.42);
  --line:rgba(55,53,47,.09); --line-strong:rgba(55,53,47,.16);
  --accent:#2383e2;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --t-gray-bg:#e3e2e0; --t-gray-fg:#32302c;
  --t-green-bg:#dbeddb; --t-green-fg:#1c3829;
  --t-yellow-bg:#fdecc8; --t-yellow-fg:#402c1b;
  --t-orange-bg:#fadec9; --t-orange-fg:#49290e;
  --t-red-bg:#ffe2dd; --t-red-fg:#5d1715;
  --red-text:#d44c47; --orange-text:#cb6f10;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --bg-soft:#202020; --hover:rgba(255,255,255,.04); --hover-strong:rgba(255,255,255,.08);
    --text:rgba(255,255,255,.81); --text-2:rgba(255,255,255,.48); --text-3:rgba(255,255,255,.3);
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
    --accent:#529cca;
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5);
    --t-gray-bg:#373737; --t-gray-fg:rgba(255,255,255,.81);
    --t-green-bg:#2b593f; --t-green-fg:rgba(255,255,255,.88);
    --t-yellow-bg:#89632a; --t-yellow-fg:rgba(255,255,255,.88);
    --t-orange-bg:#854c1d; --t-orange-fg:rgba(255,255,255,.88);
    --t-red-bg:#6e3630; --t-red-fg:rgba(255,255,255,.88);
    --red-text:#df5452; --orange-text:#e9a046;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --bg-soft:#202020; --hover:rgba(255,255,255,.04); --hover-strong:rgba(255,255,255,.08);
  --text:rgba(255,255,255,.81); --text-2:rgba(255,255,255,.48); --text-3:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --accent:#529cca;
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5);
  --t-gray-bg:#373737; --t-gray-fg:rgba(255,255,255,.81);
  --t-green-bg:#2b593f; --t-green-fg:rgba(255,255,255,.88);
  --t-yellow-bg:#89632a; --t-yellow-fg:rgba(255,255,255,.88);
  --t-orange-bg:#854c1d; --t-orange-fg:rgba(255,255,255,.88);
  --t-red-bg:#6e3630; --t-red-fg:rgba(255,255,255,.88);
  --red-text:#df5452; --orange-text:#e9a046;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}

.page{max-width:1040px;margin:0 auto;padding:56px 32px 96px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:34px;font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
.updated{margin-left:auto;color:var(--text-3);font-size:13px;padding-bottom:6px}
.updated button{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.updated button:hover{color:var(--text)}

.bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.seg{display:flex;gap:18px}
.seg button{color:var(--text-3);padding:6px 0 9px;position:relative;font-size:14px}
.seg button:hover{color:var(--text-2)}
.seg button[aria-pressed="true"]{color:var(--text);font-weight:500}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
.seg .n{color:var(--text-3);font-weight:400;margin-left:4px}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--text-3);padding-bottom:4px}
.search input{border:0;background:transparent;outline:none;width:220px;color:var(--text);padding:4px 0}
.search input::placeholder{color:var(--text-3)}
.search svg{width:15px;height:15px;flex:none}

.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-weight:400;color:var(--text-3);font-size:13px;text-align:left;padding:0;border-bottom:1px solid var(--line)}
th button{padding:12px 10px 8px;width:100%;text-align:inherit;color:inherit;white-space:nowrap}
th button:hover{color:var(--text-2)}
th.num{text-align:right}
th .arr{font-size:11px;margin-left:3px}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
.v-name{font-weight:500;line-height:1.35}
.vcell{display:flex;align-items:flex-start;gap:10px}
.emo{font-size:20px;line-height:1.1;width:26px;flex:none;text-align:center;cursor:default}
.v-co{color:var(--text-2);font-size:13px;margin-top:1px}
.v-mail{color:var(--text-3);font-size:12.5px;word-break:break-all}
.tel{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-strong)}
.kcell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.kcell .tag{height:24px}
.wa-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#25d366;color:#fff;flex:none}
.wa-btn:hover{background:#1ebe5b}
.kapso-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#111;color:#fff;flex:none}
.kapso-btn:hover{background:#333}
.kapso-btn svg{width:13px;height:13px}
.kapso-wide{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;background:#111;color:#fff;text-decoration:none;font-weight:500;font-size:13px}
.kapso-wide:hover{background:#333}
.kapso-wide svg{width:14px;height:14px}
.btnstack{display:flex;flex-direction:column;gap:6px;flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kapso-btn,:root:not([data-theme="light"]) .kapso-wide{box-shadow:0 0 0 1px rgba(255,255,255,.35)}}
:root[data-theme="dark"] .kapso-btn,:root[data-theme="dark"] .kapso-wide{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.wa-btn svg{width:14px;height:14px}
.wa-wide{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;background:#25d366;color:#fff;text-decoration:none;font-weight:500;font-size:13px}
.wa-wide:hover{background:#1ebe5b}
.wa-wide svg{width:15px;height:15px}
.tel:hover{color:var(--text-2)}
.zero{color:var(--red-text);font-weight:600}
.low{color:var(--orange-text);font-weight:600}
.muted{color:var(--text-3)}
.small{font-size:13px;color:var(--text-2)}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:13px;white-space:nowrap}
.tag.gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}
.tag.green{background:var(--t-green-bg);color:var(--t-green-fg)}
.tag.yellow{background:var(--t-yellow-bg);color:var(--t-yellow-fg)}
.tag.orange{background:var(--t-orange-bg);color:var(--t-orange-fg)}
.tag.red{background:var(--t-red-bg);color:var(--t-red-fg)}
.tag.dark{background:#37352f;color:#fff}
.tag.lost{background:#e03e3e;color:#fff;font-weight:600}
.dot.lost{background:#e03e3e}
.dot.dark{background:#37352f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.dark{background:#d3d1cb;color:#191919}}
:root[data-theme="dark"] .tag.dark{background:#d3d1cb;color:#191919}
.tag.blue{background:var(--t-blue-bg,#d3e5ef);color:var(--t-blue-fg,#183347)}
:root{--t-blue-bg:#d3e5ef;--t-blue-fg:#183347}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-blue-bg:#28456c;--t-blue-fg:rgba(255,255,255,.88)}}
:root[data-theme="dark"]{--t-blue-bg:#28456c;--t-blue-fg:rgba(255,255,255,.88)}
.kmsg{font-size:13px;color:var(--text-2);background:var(--bg-soft);border-radius:4px;padding:8px 10px;white-space:pre-wrap;max-height:140px;overflow:auto;width:100%}
.pauta-btn{border-radius:4px;padding:2px;margin:-2px}
.pauta-btn:hover{background:var(--hover-strong)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.green{background:#4dab9a}.dot.yellow{background:#cb912f}.dot.red{background:#e16259}.dot.gray{background:var(--text-3)}.dot.orange{background:#d9730d}

.foot{color:var(--text-3);font-size:13px;padding:14px 10px}
.more{color:var(--text-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}

/* popover */
.pop{position:fixed;z-index:60;background:var(--bg);border-radius:6px;box-shadow:var(--shadow);padding:6px 0;min-width:240px}
.pop .h{font-size:12px;color:var(--text-2);padding:4px 12px 6px}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;text-align:left}
button.opt:hover{background:var(--hover-strong)}
.opt .ck{margin-left:auto;color:var(--text-2)}
.opt input[type=date]{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:4px;padding:3px 6px;background:var(--bg)}
.save{padding:4px 10px;border-radius:4px;background:var(--accent);color:#fff;font-weight:500}

/* side panel */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,15,15,.1);opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(460px,100vw);background:var(--bg);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s ease;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 32px calc(40px + env(safe-area-inset-bottom,0px))}
.panel.on{transform:none}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:28px;height:28px;border-radius:4px;color:var(--text-2);font-size:18px;line-height:28px}
.close:hover{background:var(--hover-strong)}
.panel h2{font-size:24px;line-height:1.25;margin:24px 0 4px;padding-right:24px}
.panel .co{color:var(--text-2);margin-bottom:24px}
.rows{display:grid;grid-template-columns:130px 1fr;gap:4px 8px;align-items:center}
.rows .k{color:var(--text-3);font-size:13px;padding:6px 0}
.rows .v{padding:6px 0;min-height:32px;display:flex;align-items:center;word-break:break-word}
.rows input,.rows textarea{width:100%;border:0;background:transparent;outline:none;padding:4px 6px;margin:-4px -6px;border-radius:4px}
.rows input:hover,.rows textarea:hover,.rows input:focus,.rows textarea:focus{background:var(--hover-strong)}
.rows textarea{resize:vertical;min-height:56px;line-height:1.5}
.rows input::placeholder,.rows textarea::placeholder{color:var(--text-3)}
.gap{grid-column:1/-1;height:14px;border-bottom:1px solid var(--line);margin-bottom:10px}

.state{padding:56px 10px;color:var(--text-2);max-width:520px}
.state b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
.state button{margin-top:14px;padding:6px 12px;border-radius:4px;background:var(--accent);color:#fff;font-weight:500}
.skel td{height:66px}
.skel .bar-s{height:10px;border-radius:3px;background:var(--hover-strong);width:60%}
.note{font-size:13px;color:var(--t-yellow-fg);background:var(--t-yellow-bg);border-radius:4px;padding:8px 12px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2f2f2f;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.interactive{pointer-events:auto}
.toast .undo{color:#8fc5ff;font-weight:600;margin-left:10px}
.end-btn{font-size:12px;color:var(--text-2);padding:3px 8px;border-radius:4px;border:1px solid var(--line-strong);white-space:nowrap}
.end-btn:hover{background:var(--hover-strong);color:var(--text)}

.good{color:#448361;font-weight:600}
.rsec{margin:22px 0 30px}
.today-grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:start;margin-bottom:16px}
.today-main{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--bg-soft)}
.tm-l{font-size:13px;color:var(--text-2)}
.tm-v{font-size:42px;font-weight:700;line-height:1.1;margin:6px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tm-s{font-size:14px;color:var(--text-2)}
.tm-bar{position:relative;height:10px;border-radius:5px;background:var(--hover-strong);margin-top:14px}
.tm-fill{height:100%;background:#4dab9a;border-radius:5px}
.tm-fill.over{background:#2f9e6e}
.tm-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2383e2;border:2px solid var(--bg);box-shadow:0 0 0 1px #2383e2}
.tm-legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-3);margin-top:6px}
.tm-dot-i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2383e2;margin-right:5px;vertical-align:0}
.today-list{border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto}
.tl-row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-name{min-width:0}
.tl-who{display:flex;align-items:center;gap:8px;min-width:0}
.tl-btns{display:flex;gap:4px;flex:none;text-decoration:none}
.tl-row.struck .tl-btns{opacity:.7}
.tl-name .v-name,.tl-name .v-co{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-amt{font-variant-numeric:tabular-nums;font-weight:600}
.tl-p{font-variant-numeric:tabular-nums;font-size:13px;min-width:36px;text-align:right}
.tl-row.struck .tl-name .v-name,.tl-row.struck .tl-name .v-co,.tl-row.struck .tl-amt,.tl-row.struck .tl-p{text-decoration:line-through;text-decoration-color:var(--text-3)}
.tl-row.dim{opacity:.55}
.today-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi.clickable{cursor:pointer}
tr.daytoday td{background:var(--hover)}
.tl-row.wpast{opacity:.75}
.todo-group{margin:14px 0 26px}
.todo-gtabs{margin-top:6px}
.todo-msg{margin-top:6px;font-size:13px}
.atr-sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft)}
.atr-p{font-size:14px}
.queja-box{margin-top:4px;padding:6px 8px;border-left:3px solid #e03e3e;background:rgba(224,62,62,.06);border-radius:4px;color:var(--text);font-size:13px}
.nota-btn{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;background:var(--bg);cursor:pointer;display:inline-flex;gap:3px;align-items:center;margin-right:6px}
.nota-btn span{font-size:11px;color:var(--text-2);font-weight:600}
.nota-btn:hover{background:var(--hover)}
.cli-row{cursor:pointer}
.cli-row:hover td{background:var(--hover)}
.nm-ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.nm{background:var(--bg);color:var(--text);border-radius:12px;width:100%;max-width:620px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:20px}
.nm-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm-t{font-size:20px;font-weight:700}
.nm-x{font-size:18px;color:var(--text-2);padding:2px 8px;border-radius:6px}
.nm-x:hover{background:var(--hover)}
.nm-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.nm-stats div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.nm-stats span{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
.nm-stats b{font-size:17px;margin-top:2px}
.nm-stats small{font-size:11px;color:var(--text-3)}
@media (max-width:560px){.nm-stats{grid-template-columns:repeat(2,1fr)}}
.nm-new{margin-top:14px}
.nm-new textarea{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical;box-sizing:border-box}
.nm-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.nm-row select{font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.nm-list{margin-top:16px;display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
.nm-n{border-left:3px solid var(--line);padding:4px 10px}
.nm-txt{white-space:pre-wrap;font-size:14px;margin-top:3px}
.tk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.tk-dates input{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
.tk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.tk-kpi{text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg-soft);cursor:pointer}
.tk-kpi:hover{background:var(--hover-strong)}
.tk-kpi.on{outline:2px solid #e03e3e;outline-offset:-2px}
.tk-kl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.tk-kv{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tk-tag{display:inline-block;border:1px solid;border-radius:10px;padding:0 7px;font-size:12px;margin:1px 0;white-space:nowrap}
.prog-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.prog-card{border:1px solid var(--line);border-radius:10px;padding:16px}
.prog-top{display:flex;gap:14px;align-items:center}
.prog-ring{width:96px;height:96px;flex:none}
.prog-name{margin-bottom:4px}
.prog-big{font-size:16px}
.punt{margin-top:12px}
.punt-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--hover-strong)}
.punt-l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-top:5px}
.prog-days{display:flex;gap:6px;align-items:flex-end;height:58px;margin:14px 0 10px;padding-top:4px}
.pd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pd-bar{width:100%;max-width:22px;border-radius:3px 3px 0 0;min-height:2px}
.pd-l{font-size:11px;color:var(--text-3);margin-top:3px}
.pd.today .pd-l{color:var(--text);font-weight:600}
.prog-mets{display:flex;flex-direction:column;gap:4px;font-size:13px}
.pm{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pm.zero-m{color:var(--text-3)}
.pp-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}

const TOOL = "execute_read_query";
const SQL = `WITH act AS (
  SELECT v.id, MAX(vp.expires_at) AS exp, MIN(vp.created_at) AS compra0
  FROM vacancy v LEFT JOIN vacancy_payment vp ON vp.vacancy_id = v.id AND vp.deleted_at IS NULL
  WHERE v.status='enable' AND v.deleted_at IS NULL AND COALESCE(v.is_external,false)=false
  GROUP BY v.id
  HAVING MAX(vp.expires_at) IS NULL OR MAX(vp.expires_at) > NOW()
),
lastpay AS (
  SELECT DISTINCT ON (vp.vacancy_id) vp.vacancy_id, vp.plan_type
  FROM vacancy_payment vp WHERE vp.deleted_at IS NULL AND vp.vacancy_id IN (SELECT id FROM act)
  ORDER BY vp.vacancy_id, vp.expires_at DESC NULLS LAST
),
iv AS (
  SELECT i."vacancyId" vid, COUNT(*) post,
    COUNT(*) FILTER (WHERE i.comment='Candidato no cumple con los requisitos de la pre-entrevista') d_pre,
    COUNT(*) FILTER (WHERE i.status='canceled' AND i.canceled_by='recruiter') d_rec,
    COUNT(*) FILTER (WHERE i.created_at > NOW() - interval '7 days') post7,
    COUNT(*) FILTER (WHERE i.created_at > NOW() - interval '30 days') post30,
    MAX(i.created_at) last_post,
    COUNT(*) FILTER (WHERE i.attend IS TRUE OR i.attended_by_candidate IS TRUE) asist,
    COUNT(*) FILTER (WHERE i.employed IS TRUE OR i.hired_by_candidate IN ('hired','yes')) contr
  FROM interview i WHERE i.deleted_at IS NULL AND i."vacancyId" IN (SELECT id FROM act)
  GROUP BY 1
)
SELECT v.id, COALESCE(u."adminId", u.id)::text acc, c.name empresa, COALESCE(vs.title, v.name) vacante, u.email, jp.name puesto,
  COALESCE(u.lada, adm.lada) lada, COALESCE(u.phone, adm.phone) phone,
  vs.sueldo_monto, vs.sueldo_calificador, vs.sueldo_frecuencia, v.salary,
  v.formatted_address dir,
  COALESCE(iv.post,0) post, COALESCE(iv.d_pre,0) d_pre, COALESCE(iv.d_rec,0) d_rec, COALESCE(iv.post7,0) post7, COALESCE(iv.post30,0) post30, CASE WHEN iv.last_post IS NULL THEN NULL ELSE FLOOR(EXTRACT(EPOCH FROM (NOW() - iv.last_post))/86400)::int END sin_post, COALESCE(iv.asist,0) asist, COALESCE(iv.contr,0) contr,
  to_char((act.compra0 AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date,'YYYY-MM-DD') compra,
  lp.plan_type, sca.status sub_status, sca.cancel_at_period_end sub_cancel,
  to_char((act.exp AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date,'YYYY-MM-DD') vence,
  CEIL(EXTRACT(EPOCH FROM (act.exp - (NOW() AT TIME ZONE 'UTC')))/86400)::int dias,
  to_char((v.created_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City')::date,'YYYY-MM-DD') creada,
  v.job_type,
  (SELECT string_agg(vp2.id::text, ',') FROM vacancy_payment vp2 WHERE vp2.vacancy_id=v.id) pay_ids
FROM act JOIN vacancy v ON v.id=act.id
LEFT JOIN company c ON c.id=v."companyId"
LEFT JOIN "user" u ON u.id=v."userId"
LEFT JOIN "user" adm ON adm.id=u."adminId"
LEFT JOIN job_position jp ON jp.id=v."jobPositionId"
LEFT JOIN vacancy_structured vs ON vs.vacancy_id::text=v.id::text
LEFT JOIN iv ON iv.vid=v.id
LEFT JOIN lastpay lp ON lp.vacancy_id=v.id
LEFT JOIN subscription_credit_accounts sca ON sca.owner_user_id = COALESCE(u."adminId", u.id)`;

  "gestor de cobranza":"💳", "auxiliar administrativo":"🗂️", "recepcionista":"🛎️", "estilista":"💇", "maquillista":"💄",
  "manicurista":"💅", "enfermeria":"🩺", "montacarguista":"🏗️", "operador industrial":"🏭", "albanil":"🧱",

};

const RENOV_SQL = "WITH rng AS (\n  SELECT date_trunc('week', NOW() AT TIME ZONE 'America/Mexico_City') AS d0,\n         date_trunc('week', NOW() AT TIME ZONE 'America/Mexico_City') + interval '7 days' AS d1\n),\nbase_v AS (\n  SELECT vp.*, v.status vstatus, COALESCE(u.\"adminId\", u.id)::text acc, COALESCE(c.name, '') empresa, COALESCE(vs.title, v.name, '') detalle\n  FROM vacancy_payment vp\n  JOIN vacancy v ON v.id = vp.vacancy_id\n  JOIN \"user\" u ON u.id = v.\"userId\"\n  LEFT JOIN company c ON c.id = v.\"companyId\"\n  LEFT JOIN vacancy_structured vs ON vs.vacancy_id::text = v.id::text\n  WHERE vp.deleted_at IS NULL AND vp.plan_type = 'basic_vacancy' AND COALESCE(v.is_external, false) = false\n),\npay_due AS (\n  SELECT 'vacante' tipo, b.id::text pid, b.acc, b.empresa, b.detalle, COALESCE(b.amount, 0)::float amount,\n    to_char(b.expires_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD') due,\n    to_char(b.expires_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City', 'HH24:MI') hora, NULL::text renov_at,\n    CASE WHEN b.status = 'cancelled' THEN 'cancelada'\n         WHEN b.status = 'expired' THEN 'no_renovo'\n         WHEN b.vstatus = 'closed' THEN 'cerrada'\n         WHEN b.expires_at < NOW() AT TIME ZONE 'UTC' THEN 'reintentando'\n         ELSE 'pendiente' END estado\n  FROM base_v b\n  WHERE (b.expires_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City') >= (SELECT d0 FROM rng)\n    AND (b.expires_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City') < (SELECT d1 FROM rng)\n),\npay_ren AS (\n  SELECT 'vacante' tipo, b.id::text pid, b.acc, b.empresa, b.detalle, COALESCE(b.amount, 0)::float amount,\n    to_char(b.activated_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD') due,\n    to_char(b.activated_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City', 'HH24:MI') hora,\n    to_char(b.activated_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD HH24:MI') renov_at, 'renovado' estado\n  FROM base_v b\n  WHERE b.activated_at > b.created_at + interval '2 days'\n    AND (b.activated_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City') >= (SELECT d0 FROM rng)\n    AND (b.activated_at AT TIME ZONE 'UTC' AT TIME ZONE 'America/Mexico_City') < (SELECT d1 FROM rng)\n),\nsub_name AS (\n  SELECT DISTINCT ON (COALESCE(uu.\"adminId\", uu.id)) COALESCE(uu.\"adminId\", uu.id) owner, c.name\n  FROM vacancy v JOIN company c ON c.id = v.\"companyId\" JOIN \"user\" uu ON uu.id = v.\"userId\"\n  ORDER BY COALESCE(uu.\"adminId\", uu.id), v.created_at DESC\n),\nsubs_pend AS (\n  SELECT 'suscripcion' tipo, sca.id::text pid, sca.owner_user_id::text acc, COALESCE(sn.name, o.email) empresa, 'Plan de cr\u00e9ditos' detalle,\n    COALESCE(sca.amount, 2500)::float amount,\n    to_char(sca.current_period_end AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD') due,\n    to_char(sca.current_period_end AT TIME ZONE 'America/Mexico_City', 'HH24:MI') hora, NULL::text renov_at,\n    CASE WHEN sca.cancel_at_period_end THEN 'cancelada' WHEN sca.status = 'past_due' THEN 'reintentando' ELSE 'pendiente' END estado\n  FROM subscription_credit_accounts sca JOIN \"user\" o ON o.id = sca.owner_user_id LEFT JOIN sub_name sn ON sn.owner = sca.owner_user_id\n  WHERE sca.status IN ('active', 'past_due')\n    AND (sca.current_period_end AT TIME ZONE 'America/Mexico_City') >= (SELECT d0 FROM rng)\n    AND (sca.current_period_end AT TIME ZONE 'America/Mexico_City') < (SELECT d1 FROM rng)\n),\nsubs_ren AS (\n  SELECT 'suscripcion' tipo, l.id::text pid, sca.owner_user_id::text acc, COALESCE(sn.name, o.email) empresa, CASE WHEN l.reason = 'early_renewal' THEN 'Plan de cr\u00e9ditos \u00b7 renovaci\u00f3n anticipada' ELSE 'Plan de cr\u00e9ditos' END detalle,\n    COALESCE((l.metadata->>'amount_paid')::float, sca.amount, 2500)::float amount,\n    to_char(l.created_at AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD') due,\n    to_char(l.created_at AT TIME ZONE 'America/Mexico_City', 'HH24:MI') hora,\n    to_char(l.created_at AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD HH24:MI') renov_at, 'renovado' estado\n  FROM subscription_credit_ledger l\n  JOIN subscription_credit_accounts sca ON sca.id = l.account_id\n  JOIN \"user\" o ON o.id = sca.owner_user_id LEFT JOIN sub_name sn ON sn.owner = sca.owner_user_id\n  WHERE ((l.reason = 'subscription_renewal' AND COALESCE(l.metadata->>'billing_reason', '') IN ('subscription_cycle', 'subscription_update'))\n         OR l.reason = 'early_renewal')\n    AND COALESCE((l.metadata->>'amount_paid')::float, 0) > 0\n    AND (l.created_at AT TIME ZONE 'America/Mexico_City') >= (SELECT d0 FROM rng)\n    AND (l.created_at AT TIME ZONE 'America/Mexico_City') < (SELECT d1 FROM rng)\n)\nSELECT r.*, to_char((SELECT d0 FROM rng), 'YYYY-MM-DD') wk0, to_char(NOW() AT TIME ZONE 'America/Mexico_City', 'YYYY-MM-DD HH24:MI') ahora\nFROM (SELECT * FROM pay_due UNION ALL SELECT * FROM pay_ren UNION ALL SELECT * FROM subs_pend UNION ALL SELECT * FROM subs_ren) r\nORDER BY due, hora";

function buildCohorts() {
  const cur = mesKey(cohHoy || localToday());
  const out = [];
  cohRows.forEach(a => {
    const pagos = a.pagos;
    pagos.forEach((pg, i) => {
      const P = pg.d, nx = pagos[i + 1] || null, N = nx ? nx.d : null;
      const win = a.pubs.filter(d => d >= P && (!N || d < N));
      const d60 = masDias(P, 60);
      const stripe = !N && a.fin ? a.fin : null;
      let ref, razon;
      if (win.length >= 4) { ref = win[3]; razon = `Publicó ${Math.min(win.length, 5)} de 5 (la ${win.length >= 5 ? "5ª" : "4ª"} el ${fmtShort(win[Math.min(win.length, 5) - 1])})`; }
      else if (stripe && stripe < d60) { ref = stripe; razon = `Stripe renueva el ${fmtShort(stripe)}`; }
      else { ref = d60; razon = `Terminan sus 60 días el ${fmtShort(d60)}`; }
      if (N && N < ref) { ref = N; razon = `Compró paquete nuevo el ${fmtShort(N)}`; }
      const M = mesKey(ref);
      let st;
      if (N && mesKey(N) > M) {
        // pagó, pero después de su mes: en su cohorte no pagó y pasa al siguiente
        const M2 = addMes(M, 1);
        const e0 = { a, P, N, nAmt:nx.m, pub:win.length, d60, stripe, M, razon, st:"paso", rescate:false };
        out.push(e0);
        out.push({ ...e0, M:M2, razon:`No renovó en su cohorte de ${mesNombre(M)}`, st:mesKey(N) === M2 ? "pago" : "no_renueva", tarde:true, carry:true });
        return;
      }
      if (N) st = "pago";
      else if (a.status === "past_due") st = "fallido";
      else if (a.cae || a.status === "canceled") st = "cancelo";
      else st = M >= cur ? "pendiente" : "paso";
      const e = { a, P, N, nAmt:nx ? nx.m : 0, pub:win.length, d60, stripe, M, razon, st, rescate:st === "fallido" || st === "cancelo" };
      out.push(e);
      if (!N && M < cur) {
        const M2 = addMes(M, 1);
        out.push({ ...e, M:M2, razon:`No renovó en su cohorte de ${mesNombre(M)}`, st:M2 >= cur ? "ultimo" : "no_renueva", carry:true });
        if (st === "paso") e.st = "paso";
      }
    });
  });
  return out;
}

  if (f && openId) { const id = openId; save(id, { [f]:e.target.value.trim() }); setTimeout(() => { if (openId) renderPanel(); }, 0); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset?.campana) e.target.blur(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (popEl) closePop(); else if (openId) closePanel(); } });
setInterval(renderUpdated, 60000);
document.addEventListener("change", e => { const c = e.target && e.target.closest && e.target.closest("[data-todochk]"); if (c) todoToggle(c.dataset.todochk, c.checked); const dd = e.target && e.target.dataset && e.target.dataset.tkd; if (dd) { if (dd === "desde") tkDesde = e.target.value; else tkHasta = e.target.value; render(); } });

render(); renderUpdated();
(async () => { mcp = await use("mcp"); initDb(); load(); loadKapso(); loadRisk(); loadCancels(); sample = await use("sample"); render(); startAutoSummary(); })();
})();
</script>
